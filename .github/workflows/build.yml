name: Build

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"
      - "v*.*.*-rc"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            image_name: pysergio/chibi
            tag_prefix: ""
          - dockerfile: agent.Dockerfile
            image_name: pysergio/chibi
            tag_prefix: "agent-"
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ matrix.image_name }}
          flavor: |
            latest=false
          tags: |
            type=schedule,prefix=${{ matrix.tag_prefix }},pattern=nightly
            type=ref,event=branch,prefix=${{ matrix.tag_prefix }}
            type=ref,event=pr,prefix=${{ matrix.tag_prefix }}
            type=semver,pattern={{version}},prefix=${{ matrix.tag_prefix }}
            type=semver,pattern={{major}}.{{minor}},prefix=${{ matrix.tag_prefix }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-rc') && matrix.tag_prefix == '' }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64/v8
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ format('type=registry,ref={0}:{1}buildcache', matrix.image_name, matrix.tag_prefix) }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:{1}buildcache,mode=max', matrix.image_name, matrix.tag_prefix) || '' }}

  docker-full:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            pysergio/chibi
          flavor: |
            latest=false
          tags: |
            type=schedule,prefix=full-,pattern=nightly
            type=ref,event=branch,prefix=full-
            type=ref,event=pr,prefix=full-
            type=semver,pattern={{version}},prefix=full-
            type=semver,pattern={{major}}.{{minor}},prefix=full-
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: full.Dockerfile
          # The TUI build context is the remote chibi-tui repo (currently LICENSE-only);
          # this job fails until the TUI code is pushed there.
          build-contexts: |
            tui-src=https://github.com/s-nagaev/chibi-tui
          # amd64 only for now: multiarch full images (QEMU rust cross-build of the TUI) are a follow-up decision.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=pysergio/chibi:full-buildcache
          cache-to: ${{ github.event_name != 'pull_request' && 'type=registry,ref=pysergio/chibi:full-buildcache,mode=max' || '' }}
